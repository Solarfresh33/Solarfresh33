<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fade{0%,100%{opacity:0.3}50%{opacity:0.8}}
.vt{font-family:'VT323',monospace}
.bl{animation:blink 1.2s infinite}
.fd{animation:fade 2.5s infinite}
</style>
</defs>

<rect width="800" height="80" fill="#000"/>

<!-- Top border -->
<line x1="0" y1="0" x2="800" y2="0" stroke="#00ff41" stroke-width="2"/>

<!-- Decorative line pattern -->
<line x1="0"   y1="10" x2="280" y2="10" stroke="#003300" stroke-width="1"/>
<line x1="520" y1="10" x2="800" y2="10" stroke="#003300" stroke-width="1"/>

<!-- Center content -->
<text x="400" y="38" class="vt" font-size="16" fill="#1a5a1a" text-anchor="middle" letter-spacing="3">[ session terminated ]</text>

<!-- Blinking prompt -->
<text x="310" y="38" class="vt bl" font-size="16" fill="#00ff41">&#62;</text>
<text x="488" y="38" class="vt bl" font-size="16" fill="#00ff41">&#60;</text>

<!-- Binary line -->
<text x="400" y="58" class="vt fd" font-size="12" fill="#1a4a1a" text-anchor="middle" letter-spacing="2">0x534f4c4152 · github.com/Solarfresh33 · 0x534f4c4152</text>

<!-- Bottom border -->
<line x1="0" y1="79" x2="800" y2="79" stroke="#00ff41" stroke-width="2"/>
</svg>
