<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 70" width="800">
<defs>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fade{0%,100%{opacity:0.3}50%{opacity:0.9}}
.bl{animation:blink 1.2s step-end infinite}
.fd{animation:fade 3s ease-in-out infinite}
</style>
</defs>

<rect width="800" height="70" fill="#000000"/>
<rect x="0" y="0" width="800" height="1" fill="#00ff41" opacity="0.7"/>

<!-- Horizontal deco lines -->
<line x1="8"   y1="20" x2="240" y2="20" stroke="#003300" stroke-width="1"/>
<line x1="560" y1="20" x2="792" y2="20" stroke="#003300" stroke-width="1"/>
<line x1="8"   y1="22" x2="200" y2="22" stroke="#001a00" stroke-width="1"/>
<line x1="600" y1="22" x2="792" y2="22" stroke="#001a00" stroke-width="1"/>

<!-- Blinking arrows -->
<text x="244" y="24" font-family="monospace" class="bl" font-size="14" fill="#00ff41">&#62;&#62;</text>
<text x="536" y="24" font-family="monospace" class="bl" font-size="14" fill="#00ff41">&#60;&#60;</text>

<!-- Center text -->
<text x="400" y="24" font-family="monospace" font-size="13" fill="#1a6a1a" text-anchor="middle" letter-spacing="2">[ session terminated ]</text>

<!-- Hex line -->
<text x="400" y="50" font-family="monospace" font-size="11" class="fd" fill="#1a4a1a" text-anchor="middle" letter-spacing="1">0x534f4c4152 · github.com/Solarfresh33 · 0x534f4c4152</text>

<!-- Bottom corner bits -->
<text x="8"   y="64" font-family="monospace" font-size="9" fill="#0d2e0d">10110100 01001000</text>
<text x="620" y="64" font-family="monospace" font-size="9" fill="#0d2e0d">10110100 01001000</text>

<rect x="0" y="69" width="800" height="1" fill="#00ff41" opacity="0.7"/>
</svg>
