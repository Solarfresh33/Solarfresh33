<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800">
<defs>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(240px)}}
@keyframes fade{0%,100%{opacity:0.3}50%{opacity:1}}
.cur{animation:blink 1s step-end infinite}
.sc{animation:scan 3s linear infinite}
.fd{animation:fade 2.5s ease-in-out infinite}
</style>
</defs>

<!-- Background -->
<rect width="800" height="200" fill="#000000"/>

<!-- Scanline -->
<rect class="sc" x="0" y="0" width="800" height="30" fill="#00ff41" opacity="0.04"/>

<!-- Top bar -->
<rect x="0" y="0" width="800" height="30" fill="#0d0d0d"/>
<rect x="0" y="30" width="800" height="1" fill="#00ff41" opacity="0.5"/>
<circle cx="18" cy="15" r="5" fill="#ff5f57"/>
<circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
<circle cx="54" cy="15" r="5" fill="#28ca41"/>
<text x="400" y="20" font-family="monospace" font-size="12" fill="#2a6a2a" text-anchor="middle" letter-spacing="2">root@solarfresh33:~$</text>

<!-- Binary side decorations -->
<text x="8"   y="70"  font-family="monospace" font-size="10" fill="#0d2e0d">01001000</text>
<text x="8"   y="83"  font-family="monospace" font-size="10" fill="#0a240a">10110101</text>
<text x="8"   y="96"  font-family="monospace" font-size="10" fill="#071a07">01110010</text>
<text x="8"   y="109" font-family="monospace" font-size="10" fill="#050f05">11001001</text>
<text x="8"   y="122" font-family="monospace" font-size="10" fill="#030a03">01010110</text>
<text x="8"   y="135" font-family="monospace" font-size="10" fill="#020602">10001110</text>
<text x="8"   y="148" font-family="monospace" font-size="10" fill="#010401">00110101</text>

<text x="690" y="70"  font-family="monospace" font-size="10" fill="#0d2e0d">01001000</text>
<text x="690" y="83"  font-family="monospace" font-size="10" fill="#0a240a">10110101</text>
<text x="690" y="96"  font-family="monospace" font-size="10" fill="#071a07">01110010</text>
<text x="690" y="109" font-family="monospace" font-size="10" fill="#050f05">11001001</text>
<text x="690" y="122" font-family="monospace" font-size="10" fill="#030a03">01010110</text>
<text x="690" y="135" font-family="monospace" font-size="10" fill="#020602">10001110</text>
<text x="690" y="148" font-family="monospace" font-size="10" fill="#010401">00110101</text>

<!-- Brackets -->
<text x="148" y="158" font-family="monospace" font-size="95" font-weight="bold" fill="#004400">&#91;</text>
<text x="612" y="158" font-family="monospace" font-size="95" font-weight="bold" fill="#004400">&#93;</text>

<!-- Main title -->
<text x="400" y="155" font-family="monospace" font-size="90" font-weight="bold" fill="#00ff41" text-anchor="middle" letter-spacing="12">Solar</text>

<!-- Subtitle -->
<text x="373" y="180" font-family="monospace" font-size="14" fill="#2a8a2a" text-anchor="middle" letter-spacing="3">cybersecurity student</text>
<text x="467" y="180" font-family="monospace" class="cur" font-size="14" fill="#00ff41">_</text>

<!-- Bottom border -->
<rect x="0" y="198" width="800" height="2" fill="#00ff41" opacity="0.7"/>

<!-- Bottom tags -->
<text x="8"   y="195" font-family="monospace" font-size="10" fill="#1a5a1a">[+] access granted</text>
<text x="680" y="195" font-family="monospace" font-size="10" fill="#1a5a1a">v1.3.3.7</text>
</svg>
