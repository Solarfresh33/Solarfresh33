<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scan{0%{transform:translateY(-200px)}100%{transform:translateY(400px)}}
@keyframes fade{0%,100%{opacity:0.4}50%{opacity:1}}
@keyframes type{0%{opacity:0}100%{opacity:1}}
.vt{font-family:'VT323',monospace}
.cur{animation:blink 1s infinite}
.sc{animation:scan 4s linear infinite;opacity:0.04}
.gd{animation:fade 3s ease-in-out infinite}
</style>
</defs>

<!-- Background -->
<rect width="800" height="200" fill="#000"/>

<!-- Subtle scanline -->
<rect class="sc" x="0" y="0" width="800" height="40" fill="#00ff41"/>

<!-- Top border line -->
<line x1="0" y1="0" x2="800" y2="0" stroke="#00ff41" stroke-width="2"/>

<!-- Terminal top bar -->
<rect x="0" y="0" width="800" height="32" fill="#0a0a0a"/>
<circle cx="20" cy="16" r="5" fill="#ff5f57"/>
<circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
<circle cx="56" cy="16" r="5" fill="#28ca41"/>
<text x="400" y="21" class="vt" font-size="14" fill="#2a6a2a" text-anchor="middle" letter-spacing="3">root@kali:~#</text>

<!-- Corner decorations -->
<text x="10"  y="65"  class="vt" font-size="11" fill="#1a4a1a">01001000</text>
<text x="10"  y="78"  class="vt" font-size="11" fill="#143a14">10110101</text>
<text x="10"  y="91"  class="vt" font-size="11" fill="#0e2e0e">01110010</text>
<text x="10"  y="104" class="vt" font-size="11" fill="#0a240a">11001001</text>
<text x="10"  y="117" class="vt" font-size="11" fill="#071a07">01010110</text>
<text x="10"  y="130" class="vt" font-size="11" fill="#040f04">10001110</text>

<text x="685" y="65"  class="vt" font-size="11" fill="#1a4a1a" text-anchor="start">01001000</text>
<text x="685" y="78"  class="vt" font-size="11" fill="#143a14" text-anchor="start">10110101</text>
<text x="685" y="91"  class="vt" font-size="11" fill="#0e2e0e" text-anchor="start">01110010</text>
<text x="685" y="104" class="vt" font-size="11" fill="#0a240a" text-anchor="start">11001001</text>
<text x="685" y="117" class="vt" font-size="11" fill="#071a07" text-anchor="start">01010110</text>
<text x="685" y="130" class="vt" font-size="11" fill="#040f04" text-anchor="start">10001110</text>

<!-- Brackets around Solar -->
<text x="155" y="145" class="vt" font-size="90" fill="#005500">&#91;</text>
<text x="610" y="145" class="vt" font-size="90" fill="#005500">&#93;</text>

<!-- Main title -->
<text x="400" y="145" class="vt" font-size="100" fill="#00ff41" text-anchor="middle" letter-spacing="10">Solar</text>

<!-- Subtitle with blinking cursor -->
<text x="400" y="170" class="vt" font-size="18" fill="#2a8a2a" text-anchor="middle" letter-spacing="4">cybersecurity student</text>
<text x="560" y="170" class="vt cur" font-size="18" fill="#00ff41">_</text>

<!-- Bottom border -->
<line x1="0" y1="199" x2="800" y2="199" stroke="#00ff41" stroke-width="2"/>

<!-- Bottom corner tags -->
<text x="6"   y="194" class="vt" font-size="11" fill="#1a5a1a">[+] access granted</text>
<text x="650" y="194" class="vt" font-size="11" fill="#1a5a1a">v1.3.3.7</text>
</svg>
